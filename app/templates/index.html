<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#2f88ff',
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    {% load static %}

    <div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">

        <!-- Coluna do Formulário -->
        <div class="h-screen flex items-center justify-center p-4">
            <form action="{% url 'index' %}" method="post"
                class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 space-y-6">
                {% csrf_token %}

                <!-- Logo -->
                <h2 class="text-2xl text-center font-bold">Login</h2>

                <h3 class="text-xl font-semibold text-center text-gray-800">Entre com seus dados</h3>

                <!-- Campo Matrícula -->
                <div class="space-y-2">
                    <label for="username" class="block text-sm font-medium text-gray-700">Matrícula:</label>
                    <input type="text" name="username" id="username" placeholder="590019" minlength="" maxlength="6"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 transition-all duration-300" />
                </div>

                <!-- Campo Senha -->
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-medium text-gray-700">Senha:</label>
                    <input type="password" name="password" id="password" placeholder="alberto123" minlength="8"
                        maxlength="12" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-primary focus:ring-2 focus:ring-primary focus:ring-opacity-20 transition-all duration-300" />
                </div>

                <!-- Mensagens de Erro -->
                {% if messages %}
                <div class="p-3 bg-red-50 border border-red-200 rounded-lg">
                    <ul class="text-red-700 text-sm space-y-1">
                        {% for message in messages %}
                        <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
                {% endif %}

                <!-- Opções de Login -->
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" id="remember-me"
                                class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary" />
                            <label for="remember-me" class="text-sm text-gray-700">Mantenha-me conectado</label>
                        </div>
                    </div>

                    <div class="text-center">
                        <a href="#" class="inline-block font-semibold text-primary relative group">
                            Esqueci minha senha
                            <span
                                class="absolute bottom-0 left-0 w-0 h-0.5 bg-primary group-hover:w-full transition-all duration-500"></span>
                        </a>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit"
                    class="w-full bg-primary-blue text-white font-semibold py-3 px-4 rounded-xl transition-all duration-300 transform hover:scale-[1.02] focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    Entrar
                </button>

                <!-- Login Alternativo -->
                <div class="border-t border-gray-200 pt-6">
                    <h3 class="text-center text-gray-700 mb-4">Entrar de outra forma:</h3>
                    <div class="flex space-x-4">
                        <!-- Microsoft -->
                        <a href="#"
                            class="flex-1 border border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 hover:scale-105 transition-all duration-200 flex items-center justify-center">
                            <img src="{% static 'img/ms_logo.png' %}" alt="Microsoft" class="h-6 w-auto" />
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <!-- Coluna da Imagem -->
        <div class="hidden lg:flex h-screen items-center justify-center bg-gray-100">
            <img src="https://placehold.co/800x1200/2f88ff/white?text=Portal+Acadêmico" alt="Campus Universitário"
                class="w-full h-full object-cover" />
        </div>
    </div>
</body>

</html>
